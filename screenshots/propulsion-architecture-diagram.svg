  <text x="58" y="248" fill="#34d399" font-family="monospace" font-size="11">• Tsiolkovsky Mass Depletion</text>

  <rect x="40" y="315" width="260" height="175" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="58" y="345" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">2. TANK BLOWDOWN</text>
