  <text x="378" y="258" fill="#94a3b8" font-family="monospace" font-size="11">• Burnout Mass = Dry + Res</text>
  <text x="378" y="294" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Propulsion Architectures:</text>
