  <text x="58" y="453" fill="#38bdf8" font-family="monospace" font-size="11">• Isothermal Gas Expansion</text>

  <rect x="360" y="110" width="260" height="380" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
