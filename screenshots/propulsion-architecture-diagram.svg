<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#060b16"/>
  <text x="40" y="46" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">PropulsionSpaceForge Pro v1.0.0 — ECSS-E-ST-35-01C &amp; 35C Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-family="monospace" font-size="13">Multi-Maneuver Delta-V Budget • Tsiolkovsky Solver • Blowdown Pressure Ratio • Residual PMD Margin</text>

